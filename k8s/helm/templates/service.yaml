apiVersion: v1
kind: Service
metadata:
  name: {{ include "truestake-api.name" . }}
  labels:
    {{- include "truestake-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "truestake-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
